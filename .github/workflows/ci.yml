name: CI

# ============================================================================
# 五终端 CI。核心目的：把「本机 Windows 无法验证的部分」搬到 GitHub 托管 runner 上验证。
#   - ios-macos：macOS runner 真编译（本仓库 iOS 代码从未被编译器验证过，最大验证缺口）
#   - e2e-smoke：ubuntu runner 真起 11 个后端服务跑 13 步跨服务契约冒烟
#   - backend / frontend-web / miniprogram / android：回归网，防止改一端砸另一端
# 前 5 个 job 之间无 needs 依赖，完全并行；e2e-smoke 是唯一有依赖的（needs: backend，
# 因为它要消费 backend 打出来的 jar）。任一 job 失败不影响其它 job 产出日志/产物。
# ============================================================================

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_ios:
        description: '跳过 iOS job（macOS 额度紧张时用；iOS 是首次验证缺口，建议别长期跳过）'
        type: boolean
        default: false
      skip_e2e:
        description: '跳过 e2e-smoke job（省 Linux 分钟；跨服务契约网，建议别长期跳过）'
        type: boolean
        default: false

# 最小权限：所有 job 只读代码仓，不写、不发评论、不动 secrets
permissions:
  contents: read

# 并发控制：PR 上新的 push 取消旧 run（省 macOS 额度）；
# master/main 与手动触发不取消——首次 iOS 验证很贵，绝不能被后来的 push 掐断。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================================
  # 1. 后端：server/ 13 个 Maven 模块，JDK 17
  # ==========================================================================
  backend:
    name: backend (mvn test + package)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    env:
      # JDK 17 在 Linux 上默认跟随 locale（可能退化成 ASCII），
      # 显式钉 UTF-8 防止中文注释/日志乱码——这是 Windows GBK 坑在 Linux 上的等价物。
      MAVEN_OPTS: '-Dfile.encoding=UTF-8 -Xmx2g'
    steps:
      - uses: actions/checkout@v4

      # setup-java 自带 maven 缓存，key 由 cache-dependency-path（全部 pom.xml）哈希得出
      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/**/pom.xml
      # 仓库没有 Maven wrapper（mvnw 不入库），直接用 ubuntu runner 预装的 Maven 3.9.x；
      # 与本机「必须用全路径 mvn.cmd」的约定（DEV.md §1）无关——那是 Windows PATH 问题。

      - name: 可选：配置 Maven 镜像
        # GitHub 托管 runner 在美国机房，直连 Maven Central 正常，默认不配镜像。
        # 若需走阿里云加速（国内自建 runner / 网络受限时），
        # 在仓库 Settings → Secrets and variables → Actions → Variables 新增
        #   MAVEN_MIRROR_URL = https://maven.aliyun.com/repository/public
        # 即可，无需改本文件。
        if: ${{ vars.MAVEN_MIRROR_URL != '' }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <mirrors>
              <mirror>
                <id>aliyun-public</id>
                <mirrorOf>central</mirrorOf>
                <url>${{ vars.MAVEN_MIRROR_URL }}</url>
              </mirror>
            </mirrors>
          </settings>
          EOF

      # -B(batch) -ntp(不刷传输进度) 而不是 -q：-q 会把模块级 INFO 一起吞掉，
      # 出错时看不出「挂在哪个模块」，CI 上可读性优先。
      - name: 全量单测
        run: mvn -B -ntp test

      - name: 打包（跳过测试）
        run: mvn -B -ntp -DskipTests package

      - name: 上传可执行 jar
        # common 是普通 jar，其余 *-0.1.0-SNAPSHOT.jar 即各服务启动包（DEV.md §2）
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: server/**/target/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Surefire 测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: server/**/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

  # ==========================================================================
  # 2. Web 端：web-admin / web-buyer 并行（同一套 React+Vite 工具链，只是依赖不同）
  # ==========================================================================
  frontend-web:
    name: frontend-web (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # 任何一个端挂掉都要看到另一个端的结果，所以不 fail-fast
      fail-fast: false
      matrix:
        app: [web-admin, web-buyer]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      # 必须先装 pnpm 再 setup-node：setup-node 的 cache:'pnpm' 依赖 PATH 上已有 pnpm
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本机一致（pnpm 12 用 pnpm-workspace.yaml 的 allowBuilds 字段放行 esbuild 构建脚本，
          # pnpm 11 及更早不认该字段名，会导致 esbuild postinstall 被拦 → vite 构建失败）
          version: 12.6.0

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（tsc -b && vite build）
        run: pnpm build

      - name: ESLint
        run: pnpm lint

      - name: 单测（vitest run）
        run: pnpm test

      - name: 上传 dist 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}/dist
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # 3. 小程序：uni-app，H5 与微信小程序双构建
  # ==========================================================================
  miniprogram:
    name: miniprogram (type-check + h5 + mp-weixin)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 同 frontend-web：本仓 lockfile 由 pnpm 12 生成，且 .npmrc / pnpm-workspace.yaml
          # 用了 pnpm 12 的 strict-peer-dependencies / allowBuilds 新字段
          version: 12.6.0

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: miniprogram/pnpm-lock.yaml

      # 这里用普通 install 而非 --frozen-lockfile：uni-app 的 peer 依赖树很脆，
      # 本 job 的目的是验证「能编译出 H5 + mp-weixin 两份产物」，不是充当 lockfile 门禁；
      # 若哪天 lockfile 与 package.json 不同步，--frozen-lockfile 会让 CI 因无关原因红。
      - name: 安装依赖
        run: pnpm install

      - name: 类型检查（vue-tsc）
        run: pnpm type-check

      - name: 构建 H5
        run: pnpm build:h5

      - name: 构建微信小程序
        run: pnpm build:mp-weixin

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-dist
          path: miniprogram/dist/build
          if-no-files-found: error
          retention-days: 7

  # ==========================================================================
  # 4. Android：Kotlin + Compose，assembleDebug
  # ==========================================================================
  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库没有 gradle wrapper（gradlew / gradle/wrapper 未入库），
      # 因此必须由 setup-gradle 显式装版本：README 要求 Gradle 8.4+（AGP 8.2.2 下限 8.2），
      # 8.4 正是本机验证过的版本，锁死它避免 Gradle 大版本升级带来的无谓差异。
      # 该 action 同时开启 ~/.gradle 缓存（key 自带 build 脚本哈希）。
      - name: 准备 Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: 安装 SDK 平台与构建工具
        # 不用 android-actions/setup-android：该 action 内部会再跑一次预装的 sdkmanager，
        # 在当前 runner 镜像上以 exit code 1 失败（cmdline-tools 版本化路径 + 无 licenses 上下文）。
        # ubuntu runner 本就预装了完整 Android SDK，直接用它更稳：
        #   - 显式定位版本化路径（cmdline-tools/16.0 与 latest 别名不总是都在）
        #   - 显式 --sdk_root，避免 sdkmanager 因 ANDROID_HOME 未导出而找不到 root
        # compileSdk / buildToolsVersion 取自 app/build.gradle.kts（34 / 34.0.0）
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "找不到 sdkmanager，请检查 runner 镜像"; exit 1; fi
          echo "使用 $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 写入 local.properties
        # local.properties 被 .gitignore 忽略（不入库），CI 必须用 ANDROID_HOME 现写；
        # baseUrl 不写则走 app/build.gradle.kts 的缺省值 http://10.0.2.2:8080/（编译期无影响）
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "baseUrl=http://10.0.2.2:8080/" >> local.properties

      - name: 编译 debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================================================
  # 5. iOS（本 CI 的核心目的）
  #    仓库 .xcodeproj 不入库 → 必须先 xcodegen generate 再 xcodebuild。
  #    ⚠️ 首次运行大概率失败：iOS 代码从未被 Xcode 编译过（本机 Windows 无 Xcode）。
  #       失败是预期结果，本 job 的价值就是把真实编译错误抓出来，详见 .github/README.md。
  # ==========================================================================
  ios-macos:
    name: ios-macos (xcodebuild)
    if: ${{ !inputs.skip_ios }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        # .xcodeproj 由 project.yml 生成且已 gitignore，CI 必须现装现生成
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios-client
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: 列出工程 target / scheme（排查 scheme 名是否对得上）
        working-directory: ios-client
        # project.yml 里 name=EasyShopping、target=EasyShopping、scheme 显式声明，
        # 所以 scheme 名与 project 名都应是 EasyShopping；这里打出来便于对不上时一眼定位
        run: xcodebuild -list -project EasyShopping.xcodeproj

      - name: 缓存 DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          # key 含全部 Swift 源码 + project.yml 的哈希：任一源码/工程规格改动即失效
          key: ios-deriveddata-${{ hashFiles('ios-client/**/*.swift', 'ios-client/project.yml') }}
          restore-keys: |
            ios-deriveddata-

      - name: 编译（xcodebuild）
        id: xcodebuild
        # continue-on-error：让后面的「上传日志 / 写错误摘要」在失败时也一定执行（if: always()）
        # 最终成败由最后一步按 outcome 判定
        continue-on-error: true
        working-directory: ios-client
        run: |
          set -o pipefail   # 不加这句，管道会取 tee 的退出码，xcodebuild 失败会被吞掉
          xcodebuild \
            -project EasyShopping.xcodeproj \
            -scheme EasyShopping \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/EasyShopping.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
        # 说明：
        #  · 不接 xcpretty —— 它会把原始 `文件:行:列: error: 描述` 行重排/截断，
        #    反而破坏「抓前 50 条 error」这个目的；原始日志 + tee 才是最佳可诊断格式。
        #  · generic/platform=iOS Simulator —— 不挑具体机型/系统版本，
        #    免去模拟器 runtime 版本漂移与启动失败，CI 只验「能不能编译过」。

      - name: 上传完整构建日志与 xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/EasyShopping.xcresult
          if-no-files-found: warn
          retention-days: 30   # macOS 额度稀缺，失败现场留久一点

      - name: 汇总编译错误到 Job Summary
        if: always()
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          {
            echo "## iOS 编译结果（EasyShopping / iOS 16.0 / Swift 5 模式）"
            echo
            if [ "${{ steps.xcodebuild.outcome }}" != "failure" ]; then
              echo "✅ xcodebuild 通过（scheme `EasyShopping`，destination `generic/platform=iOS Simulator`）"
              echo
            else
              echo "❌ xcodebuild 失败"
              echo
              echo "> **首次失败属于预期结果**：iOS 客户端此前从未被 Xcode 编译过（本项目在 Windows 开发）。"
              echo "> 处理方式见 \`.github/README.md\` 的「iOS 首次运行预期」。"
              echo
              if [ -f "$LOG" ]; then
                # grep -c 无匹配时打印 0 但退出码 1，必须 || true 兜住（shell 默认 -e）
                TOTAL=$(grep -c "error:" "$LOG" || true)
                echo "错误行总数：**${TOTAL:-0}**（下方最多列出 50 条）"
                echo
                echo "<details><summary>前 50 条 <code>error:</code> 行</summary>"
                echo
                echo '```'
                # 先捕获再判空：`grep ... | head -50 || echo` 的兜底分支永远不会触发（管道退出码取自 head）
                ERRORS=$(grep -n "error:" "$LOG" | head -50 || true)
                if [ -n "$ERRORS" ]; then
                  echo "$ERRORS"
                else
                  echo "（日志中没有 error: 行——失败可能发生在 xcodegen / 工程加载 / 签名阶段，请直接看完整日志）"
                fi
                echo '```'
                echo
                echo "</details>"
              else
                echo "未生成 xcodebuild.log：失败发生在更早的环节（xcodegen / brew / checkout），请看上方步骤日志。"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 按编译结果判定成败
        if: steps.xcodebuild.outcome == 'failure'
        run: |
          echo "xcodebuild 失败，完整日志见 artifact：ios-build-log"
          exit 1

  # ==========================================================================
  # 6. e2e-smoke：真实起 11 个后端服务，跑通完整购物链路
  #
  # 为什么需要它（这是本 job 存在的唯一理由，不要为了"让 CI 变绿"削弱它）：
  #   AUDIT 查出的两个资金级 P0 —— prepay 取了 totalAmount 而不是订单快照的 payAmount、
  #   refund 是空实现 —— **都发生在被 @MockBean 掉的跨服务边界上**。
  #   `mvn test` 全绿，但契约是错的。单元测试验证的是"模块内"，验证不了"模块间"。
  #   server/scripts/smoke.ps1 早已能在本机跑通 13 步 32 断言，但一直只在本机跑，
  #   也就是说"跨服务契约"至今没有任何自动化保护。本 job 把它变成每次 push 都验证的东西。
  #
  # 用 pwsh 而不是 bash 重写一套：smoke.ps1 里的 32 条断言（浮点比较 Eq、券的 UTC 时间
  # 拼装、下单 payload 拼串、响应信封取值）是唯一实现。复制成 bash 等于制造第二份会漂移的
  # 契约校验；ubuntu-latest 自带 PowerShell 7，直接跑同一份脚本是最强保证。
  # ==========================================================================
  e2e-smoke:
    name: e2e-smoke (11 services + 13-step contract smoke)
    if: ${{ !inputs.skip_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 唯一有 needs 的 job：必须等 backend 打完 jar（backend 失败则本 job 自动跳过）
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        # 不用 setup-java 的 maven 缓存：这里不跑 mvn，只 java -jar 启服务
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 取出 backend job 的 jar
        # backend 上传的是 server/**/target/*.jar，upload-artifact 以「所有命中文件的最小公共
        # 祖先」为根，即 server/ —— 所以下载到 path: server 后正好还原成
        #   server/<module>/target/<module>-0.1.0-SNAPSHOT.jar
        # 正是 start-all.ps1 期望的布局（它按 server/<svc>/target/ 找 jar）。
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: server

      - name: 校验 jar 还原结果 + 打印工具链版本
        working-directory: server
        run: |
          set -euo pipefail
          java -version 2>&1
          pwsh --version
          echo '--- 还原到的 jar ---'
          # 用 || true：glob 没命中时 ls 退出码非 0，交给下面循环给出「缺哪个模块」的可读提示
          ls -1 */target/*.jar || echo '(一个 jar 都没还原出来)'
          missing=0
          for m in core-user core-product core-price core-inventory core-cart core-order \
                   core-payment core-promotion core-search admin-bff gateway; do
            if [ ! -f "$m/target/$m-0.1.0-SNAPSHOT.jar" ]; then
              echo "::error::缺少 $m/target/$m-0.1.0-SNAPSHOT.jar"
              missing=1
            fi
          done
          exit $missing

      - name: 起服务（11 个 JVM 并发冷启动，就绪上限 600s）
        id: start
        working-directory: server
        # continue-on-error：起服务失败也要走后面的「上传日志 / Job Summary」，否则最需要日志的时候没日志
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p logs
          # 用 -Command 而不是 -File：GitHub 的 `shell: pwsh` 是**点加载**临时脚本，
          # 点加载不会传参，-ReadyTimeoutSec / -JvmArgs 会被静默丢弃。
          pwsh -NoProfile -Command "& './scripts/start-all.ps1' -ReadyTimeoutSec 600 -JvmArgs @('-Xmx448m','-Xms96m','-XX:MaxMetaspaceSize=192m','-XX:+UseSerialGC','-Xss512k')" \
            2>&1 | tee logs/start-ci.txt

      - name: 跑端到端冒烟（13 步 32 断言，全走网关 :8080）
        id: smoke
        working-directory: server
        continue-on-error: true
        run: |
          set -o pipefail
          # smoke.ps1 零参数，-File 即可；set -o pipefail 保证 tee 不吞掉 pwsh 的非 0 退出码
          pwsh -NoProfile -File ./scripts/smoke.ps1 2>&1 | tee logs/smoke-ci.txt

      - name: 停服务（无论成败）
        if: always()
        working-directory: server
        run: |
          pwsh -NoProfile -File ./scripts/stop-all.ps1 || true
          # 兜底：pid 文件在 runner 被强杀/脚本提前退出时可能不完整，
          # ubuntu runner 是一次性的，直接把所有本 job 拉起的 java 收干净。
          pkill -f 'java -jar' || true
          sleep 2
          pkill -9 -f 'java -jar' || true
          echo '清理完成'

      - name: 上传服务日志与冒烟输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            server/logs/*.log
            server/logs/smoke-ci.txt
            server/logs/start-ci.txt
          if-no-files-found: warn
          retention-days: 14

      - name: 汇总结果到 Job Summary
        if: always()
        run: |
          SMOKE="server/logs/smoke-ci.txt"
          START="server/logs/start-ci.txt"
          {
            echo "## e2e-smoke：11 服务 + 13 步跨服务契约冒烟"
            echo
            if [ "${{ steps.start.outcome }}" = "success" ] && [ "${{ steps.smoke.outcome }}" = "success" ]; then
              echo "✅ 11 个服务就绪，13 步 / 32 断言全绿（全部经网关 \`http://127.0.0.1:8080\`）"
              echo
            else
              # 注意：GitHub 的 run 块是 bash -e，`[ ... ] && echo` 在条件为假时整体返回 1
              # 会直接把步骤判失败（Summary 写一半就没了），所以一律用 if/fi。
              if [ "${{ steps.start.outcome }}" != "success" ]; then
                echo "❌ **服务未全部就绪**（start-all.ps1 退出码非 0）"
              fi
              if [ "${{ steps.smoke.outcome }}" != "success" ]; then
                echo "❌ **冒烟未全绿**（smoke.ps1 退出码非 0）"
              fi
              echo
            fi

            if [ -f "$SMOKE" ]; then
              TOTAL=$(grep -c '^  \[PASS\]' "$SMOKE" || true)
              FAILED=$(grep -c '^  \[FAIL\]' "$SMOKE" || true)
              echo "断言统计：**通过 ${TOTAL:-0} / 失败 ${FAILED:-0}**"
              echo
              if [ "${FAILED:-0}" -gt 0 ]; then
                echo "<details open><summary>失败的断言</summary>"
                echo
                echo '```'
                grep -n '^  \[FAIL\]' "$SMOKE" || true
                echo '```'
                echo
                echo "</details>"
                echo
              fi
              # 服务没起来时冒烟会在第 0 步就退（exit 2），断言列表是空的，
              # 这时把前置检查的输出翻出来才看得出是网关没就绪还是别的
              if [ "${FAILED:-0}" -eq 0 ] && [ "${{ steps.smoke.outcome }}" != "success" ]; then
                echo "<details open><summary>冒烟输出（无失败断言，多半是前置检查没过）</summary>"
                echo
                echo '```'
                head -40 "$SMOKE" || true
                echo '```'
                echo
                echo "</details>"
                echo
              fi
            else
              echo "未生成 \`smoke-ci.txt\`：失败发生在更早的环节（jar 还原 / 服务就绪），请看上方步骤日志与 artifact \`e2e-service-logs\`。"
              echo
            fi

            if [ "${{ steps.start.outcome }}" != "success" ] && [ -f "$START" ]; then
              echo "<details><summary>启动失败上下文（start-all.ps1 末尾 60 行）</summary>"
              echo
              echo '```'
              tail -60 "$START" || true
              echo '```'
              echo
              echo "</details>"
              echo
            fi

            # 各服务日志里的 ERROR 行：定位是哪个服务先炸的
            ERRS=$(grep -rn --include='*.log' -E '^\s*[0-9-]+ [0-9:.]+\s+ERROR|APPLICATION FAILED TO START' server/logs 2>/dev/null | head -25 || true)
            if [ -n "$ERRS" ]; then
              echo "<details><summary>服务日志中的 ERROR（最多 25 条）</summary>"
              echo
              echo '```'
              echo "$ERRS"
              echo '```'
              echo
              echo "</details>"
              echo
            fi
            echo "> 完整日志见 artifact \`e2e-service-logs\`（含 \`server/logs/<svc>.log\` 与 \`.err.log\`）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 按结果判定成败
        run: |
          rc=0
          if [ "${{ steps.start.outcome }}" != "success" ]; then
            echo "服务未全部就绪，详见 Job Summary 与 artifact：e2e-service-logs"
            rc=1
          fi
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "冒烟未全绿，详见 Job Summary 与 artifact：e2e-service-logs"
            rc=1
          fi
          exit $rc